[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "luma-session-scraper"
version = "0.1.0"
description = "API-first Luma event discovery and authorized guest exports"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "DeadHead04"}]
keywords = ["luma", "lu.ma", "events", "scraper", "guest-list", "csv", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP",
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["build>=1.2,<2"]
chrome = ["browser-cookie3>=0.20,<1"]
login = ["playwright>=1.48,<2"]

[project.urls]
Homepage = "https://github.com/DeadHead04/luma-scraper"
Documentation = "https://github.com/DeadHead04/luma-scraper#readme"
Issues = "https://github.com/DeadHead04/luma-scraper/issues"
Changelog = "https://github.com/DeadHead04/luma-scraper/blob/main/CHANGELOG.md"

[project.scripts]
luma-scraper = "luma_scraper.cli:main"

[tool.setuptools.packages.find]
include = ["luma_scraper*"]
